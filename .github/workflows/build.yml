name: Build mod

# Build Minecraft 1.21.11
# Chi can sua phan "matrix" ben duoi neu muon doi phien ban.
on:
  push:
    branches: [ main, master ]
    tags: [ 'v*' ]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - mc: "1.21.11"
            loom: "1.14-SNAPSHOT"
            gradle: "9.2.1"
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # Neu repo chua co source mod -> giai nen source mod nhung san trong file nay
